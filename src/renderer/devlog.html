<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Developer log</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4; font: 12px/1.45 ui-monospace, Consolas, "DejaVu Sans Mono", monospace; }
  #bar { position: fixed; top: 0; left: 0; right: 0; padding: 6px 8px; background: #2d2d2d; border-bottom: 1px solid #444; display: flex; gap: 8px; align-items: center; }
  #bar button { background: #3c3c3c; color: #ddd; border: 1px solid #555; padding: 3px 10px; cursor: pointer; }
  #bar span { color: #999; margin-left: auto; }
  #log { position: absolute; top: 38px; bottom: 0; left: 0; right: 0; overflow: auto; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; user-select: text; }
  .err { color: #f48771; }
  .tag { color: #7fb4e0; }
</style>
</head>
<body>
<div id="bar"><button id="copy">Copy all</button><button id="clear">Clear</button><span>Passwords are never written here. Send this text when something does not work.</span></div>
<div id="log"></div>
<script>
  const log = document.getElementById('log');
  const lines = [];
  function add(l) {
    lines.push(l);
    const d = document.createElement('div');
    d.textContent = l;
    if (/ERROR|FAILED|failed|NOT available|HTTP [45]/.test(l)) d.className = 'err';
    const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.appendChild(d);
    if (stick) log.scrollTop = log.scrollHeight;
  }
  (async () => {
    for (const l of await window.api.devBuffer()) add(l);
    window.api.onDevLine(add);
  })();
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(lines.join('\n'));
  document.getElementById('clear').onclick = () => { lines.length = 0; log.textContent = ''; };
</script>
</body>
</html>
